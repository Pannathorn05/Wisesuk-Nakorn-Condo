        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/bookings:
    get:
      tags: [admin]
      summary: จัดการการจอง
      description: >
        เรียงใหม่สุดก่อน · `search` = ILIKE ใน code, เลขห้อง, ชื่อ/นามสกุลเจ้าของบัญชี (ไม่รวมอีเมลและชื่อผู้เข้าพัก)
        · ใบ `pending_payment` ไม่มี `latest_payment` แนบมา (AC-28)
      operationId: listAdminBookings
      parameters:
