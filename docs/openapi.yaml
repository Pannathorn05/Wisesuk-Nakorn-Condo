    get:
      tags: [admin]
      summary: ประวัติการใช้งาน
      description: >
        เรียงใหม่สุดก่อน · admin เห็นเฉพาะ log ที่ `branch_id` เป็นสาขาตัวเอง · super admin ไม่ส่ง `branch_id`
        → ทุกแถวรวมที่ `branch_id` เป็น NULL (AC-13)
      operationId: listActivityLogs
