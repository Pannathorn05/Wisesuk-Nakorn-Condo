        - $ref: '#/components/parameters/BookingStatusQuery'
        - $ref: '#/components/parameters/StayTypeQuery'
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: รายการแบบแบ่งหน้า
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/bookings/{bookingID}/approve:
    post:
      tags: [admin]
      summary: อนุมัติการจอง
      description: >
        ใบต้องเป็น `awaiting_review` · payment ที่ยัง `submitted` เป็น `approved` · ใบรายเดือนทำให้ห้องเป็น `occupied`
        ใน transaction เดียวกัน · ไม่ต้องส่ง body · ใบของสาขาอื่น → 404 (AC-10)
      operationId: approveBooking
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      responses:
        '200':
          description: อนุมัติสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotAwaitingReview'

  /api/v1/admin/bookings/{bookingID}/reject:
    post:
      tags: [admin]
      summary: ปฏิเสธการแจ้งชำระ — ใบกลับเป็น pending_payment
      description: >
        ใบต้องเป็น `awaiting_review` · ใบ**กลับไปเป็น `pending_payment`** และยังถือห้องไว้ · payment เป็น `rejected`
        และเก็บเหตุผลที่ `reject_reason` · ลำดับตรวจ: ใบไม่มี/ข้ามสาขา 404 → สถานะผิด 409 → ไม่มีเหตุผล 422 (AC-10)
      operationId: rejectBooking
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  description: ถูก trim · ค่าว่างได้ 422
      responses:
        '200':
          description: ปฏิเสธสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotAwaitingReview'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/admin/bookings/{bookingID}/appointment:
    put:
