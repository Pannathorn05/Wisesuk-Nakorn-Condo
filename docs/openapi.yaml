openapi: 3.0.3

info:
  title: Wisetsuk Nakorn Condo Booking API
  version: 1.1.0
  description: |
    REST API ระบบจองห้องพักวิเศษสุขนครคอนโดและหอพักในเครือ

    ไฟล์นี้เขียนตามโค้ดจริงใน `backend/` ณ 2026-09-24 (commit `96298ce`, migration 0001–0008)
    พฤติกรรมละเอียดและช่องว่างที่รู้แล้วอยู่ใน `docs/SPEC.md` (อ้างเป็น AC-n ในคำอธิบายแต่ละ endpoint)

    **ยังไม่มีในโค้ด จึงไม่อยู่ในไฟล์นี้** (แผนงานอยู่ใน SPEC):
    `POST /api/v1/auth/forgot-password`, `POST /api/v1/auth/reset-password` (AC-23)
    และ `GET /api/v1/bookings/{bookingID}/slip` (AC-17)

    ## รูปแบบ response
    - สำเร็จ → `{"data": ...}` · รายการแบ่งหน้า → `{"data": [...], "meta": {page, page_size, total_items, total_pages}}`
    - 204 → ไม่มี body
    - ข้อยกเว้นเดียว: `GET /health` ไม่ห่อ `data`
    - error ทุกตัว (รวม 404/405 ของ router และ 500) → `{"error": {"code", "message", "fields"?}}`
      โดย `fields` มีเฉพาะเมื่อ `code = validation_failed` · 5xx ไม่เคยมีรายละเอียดภายใน
    - ฟิลด์ที่ไม่ได้อยู่ใน `required` ของ schema คือฟิลด์ที่ **ถูกตัดทิ้งทั้ง key** เมื่อว่างหรือ NULL (Go `omitempty`)
      ไม่ได้ส่งมาเป็น `null`

    ## รหัสอ้างอิง (id)
    ทุก id เป็นสตริงมี prefix ของตาราง + ตัวเลขอย่างน้อย 3 หลัก เช่น `brn-001`, `rm-012`, `bkg-1000`
    prefix: `brn` สาขา · `bimg` รูปสาขา · `amt` สิ่งอำนวยความสะดวก · `np` สถานที่ใกล้เคียง · `usr` ผู้ใช้ ·
    `rmt` ประเภทห้อง · `rm` ห้อง · `rimg` รูปห้อง · `bkg` ใบจอง · `pay` การชำระเงิน · `ntf` แจ้งเตือน ·
    `log` activity log · `ast` ไฟล์รูป
    ตอนรับเข้า: prefix ไม่สนตัวพิมพ์ และตัดศูนย์นำหน้าให้เอง (`BRN-1` = `brn-001`) · ตัวเลขเปล่า, prefix ของตารางอื่น
    หรือค่า ≤ 0 → 400 `bad_request`

    ## body แบบ JSON
    - ฟิลด์ที่ไม่รู้จัก → 422 `validation_failed` พร้อม `fields.<ชื่อฟิลด์> = "ไม่อนุญาตให้ส่งฟิลด์นี้"`
    - พาร์สไม่ได้, ชนิดผิด, มี JSON มากกว่า 1 object หรือใหญ่เกิน 1MB → 400

    ## การยืนยันตัวตน
    `Authorization: Bearer <access_token>` (JWT HS256, `iss=wisetsuk-api`, อายุ 30 นาที)
    role, สาขา และสถานะบัญชีอ่านจากฐานข้อมูลทุกคำขอ ไม่ได้เชื่อ claim ใน token (AC-3)

    ## สิทธิ์รายสาขา (AC-4)
    Admin ผูกกับสาขาเดียว — ไม่ส่ง `branch_id` = สาขาตัวเอง · ส่งสาขาอื่น = 403
    Super Admin ไม่ส่ง `branch_id` = ทุกสาขา (endpoint แบบรายการ) หรือ 400 (endpoint ที่แก้ข้อมูลสาขา)

    ## เวลา
    วันที่ล้วนรับเข้าเป็น `YYYY-MM-DD` · "วันนี้/อดีต" ตัดสินตามปฏิทิน Asia/Bangkok · เวลาที่ไม่มี timezone
    ตีความเป็นเวลาไทย (AC-22)

servers:
  - url: http://localhost:8080
    description: development

tags:
  - name: system
    description: สถานะระบบและไฟล์ static
  - name: auth
    description: สมัครสมาชิก เข้าสู่ระบบ และจัดการ token
  - name: oauth
    description: เข้าสู่ระบบด้วย Google / Facebook
  - name: guest
    description: ข้อมูลสาธารณะที่ดูได้โดยไม่ต้องล็อกอิน
  - name: me
    description: โปรไฟล์ รหัสผ่าน และแจ้งเตือนของผู้ใช้ที่ล็อกอินอยู่ (ทุกบทบาท)
  - name: bookings
    description: การจองของสมาชิก และการดู/ยกเลิกใบจองรายชิ้น
  - name: admin
    description: งานของ Admin (สาขาตัวเอง) และ Super Admin (ทุกสาขา)
  - name: superadmin
    description: งานที่ทำได้เฉพาะ Super Admin

security:
  - bearerAuth: []

paths:

  # ================================================================== system

  /health:
    get:
      tags: [system]
      summary: ตรวจสอบสถานะระบบ
      description: ไม่ห่อด้วย `data` — เป็นข้อยกเว้นเดียวของระบบ
      operationId: getHealth
      security: []
      responses:
        '200':
          description: ระบบทำงานปกติ
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status:
                    type: string
                    enum: [healthy]
                  time:
                    type: string
                    format: date-time
                    description: เวลาปัจจุบันแบบ UTC

  /files/{assetID}:
    get:
      tags: [system]
      summary: รูปสาขา/ห้องที่อัปโหลดเก็บไว้ในฐานข้อมูล
      description: >
        เปิดสาธารณะ ใช้เป็น src ของ <img> ได้ตรง ๆ · เนื้อไฟล์ผูกกับ assetID ตายตัว (dedup ด้วย sha256)
        จึงตอบ ETag และ Cache-Control แบบ immutable (AC-14)
      operationId: getAsset
      security: []
      parameters:
        - $ref: '#/components/parameters/AssetIDPath'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: เนื้อไฟล์รูป
          headers:
            ETag:
              description: sha256 ของเนื้อไฟล์ในเครื่องหมายคำพูด
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: public, max-age=31536000, immutable
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: ETag ตรงกับ If-None-Match
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    head:
      tags: [system]
      summary: เหมือน GET แต่ไม่มี body
      operationId: headAsset
      security: []
      parameters:
        - $ref: '#/components/parameters/AssetIDPath'
      responses:
        '200':
          description: มีไฟล์นี้
        '400':
          description: id ผิดรูปแบบ
        '404':
          description: ไม่มีไฟล์นี้

  /uploads/{filepath}:
    get:
      tags: [system]
      summary: ไฟล์บนดิสก์ใน UPLOAD_DIR — สลิปโอนเงินและรูปเดโมจาก seed
      description: >
        เปิดสาธารณะ **ไม่มีการตรวจสิทธิ์** ใครที่รู้ URL ของสลิปก็เปิดได้ (AC-17)
        · path ว่างหรือลงท้ายด้วย `/` → 404 (ไม่ให้ไล่ดูรายชื่อไฟล์)
        · สลิปอยู่ที่ `slips/YYYY/MM/<uuid>.<ext>` · รูปเดโมอยู่ที่ `<slug>/<path>`
        · ในโค้ดเป็น route `GET /uploads/*filepath` (filepath มี `/` ได้หลายชั้น)
      operationId: getUpload
      security: []
      parameters:
        - name: filepath
          in: path
          required: true
          schema:
            type: string
          example: slips/2026/09/1b4e28ba-2fa1-11d2-883f-0016d3cca427.jpg
      responses:
        '200':
          description: เนื้อไฟล์
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: ไม่มีไฟล์ หรือ path เป็นโฟลเดอร์

  # ================================================================== auth

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: สมัครสมาชิก (ได้ role member เสมอ)
      description: >
        สำเร็จแล้วได้ token คู่เลย ไม่ต้องล็อกอินซ้ำ · อีเมลถูก trim และเก็บเป็นตัวพิมพ์เล็ก
        · อีเมลซ้ำกับบัญชีใดก็ได้ (รวมที่ถูกระงับ/ลบ) → 422 · สมัครพร้อมกันด้วยอีเมลเดียวกัน → อีกใบได้ 409 (AC-1)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: สมัครสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: เข้าสู่ระบบ (endpoint เดียวทุกบทบาท)
      description: |
        ไม่ตรวจรูปแบบ input — body `{}` ได้ 401 `invalid_credentials` (AC-2)

        Rate limit นับที่ DB ในหน้าต่าง 15 นาที: ล้มเหลว 5 ครั้งต่อคู่ (อีเมล, IP) หรือ 20 ครั้งต่อ IP
        → 429 ทั้งที่รหัสถูกและไม่ว่าอีเมลจะมีบัญชีหรือไม่ · 403 `account_disabled` ไม่นับเป็นความล้มเหลว
        · สำเร็จแล้วล้างตัวนับของคู่ (อีเมล, IP) นั้น
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >
            อีเมลไม่มีในระบบ / รหัสผิด / บัญชี OAuth ที่ยังไม่ตั้งรหัส / บัญชีที่ถูกลบ — ข้อความเดียวกันทุกกรณี
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_credentials
                  message: อีเมลหรือรหัสผ่านไม่ถูกต้อง
        '403':
          description: รหัสผ่านถูกแต่บัญชีถูกระงับ (ตรวจหลังรหัสผ่านเท่านั้น)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: account_disabled
                  message: บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ
        '422':
          description: ส่งฟิลด์ที่ไม่รู้จักมา
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: หมุน refresh token (ใบเดิมถูกเพิกถอนทันที)
      description: >
        ใบซ้ำ/หมดอายุ/logout แล้ว/มั่ว/ว่าง → 401 · บัญชีถูกระงับ → 401 และใบนั้นถูกใช้ไปแล้ว
        · token ใบใหม่อ่าน role/ชื่อ/สาขาจาก DB ณ ตอนนั้น (AC-3)
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: ได้ token คู่ใหม่
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: ออกจากระบบ (เพิกถอน refresh token ใบนี้)
      description: ค่าใดก็ได้ (ผิด/หมดอายุ/ไม่มีจริง/ว่าง) → 204 เหมือนกัน · ไม่มี body เลย → 400
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: ออกจากระบบแล้ว
        '400':
          $ref: '#/components/responses/BadRequest'

  # ================================================================== oauth

  /api/v1/auth/oauth:
    get:
      tags: [oauth]
      summary: provider ที่เปิดใช้งานอยู่
      description: เปิดเฉพาะ provider ที่ตั้ง client id และ secret ครบ · เรียง google ก่อน facebook (AC-24)
      operationId: listOAuthProviders
      security: []
      responses:
        '200':
          description: รายชื่อ provider
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [providers]
                    properties:
                      providers:
                        type: array
                        items:
                          $ref: '#/components/schemas/OAuthProvider'
              example:
                data:
                  providers: [google]

  /api/v1/auth/oauth/{provider}:
    get:
      tags: [oauth]
      summary: พาเบราว์เซอร์ไปหน้ายินยอมของ provider
      description: >
        ใช้เป็นลิงก์ให้เบราว์เซอร์เปิดตรง ๆ ไม่ใช่ fetch · ตั้ง cookie `wisetsuk_oauth_state` และ
        `wisetsuk_oauth_verifier` (HttpOnly, SameSite=Lax, path `/api/v1/auth/oauth`, อายุ 10 นาที,
        Secure เฉพาะ production) แล้ว 302 ไป provider ด้วย PKCE S256 · Google บังคับ `prompt=select_account`
        · redirect URI = `{PUBLIC_BASE_URL}/api/v1/auth/oauth/{provider}/callback`
      operationId: startOAuth
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderPath'
      responses:
        '302':
          description: ไปหน้ายินยอมของ provider
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
        '404':
          description: provider ไม่รู้จักหรือปิดอยู่
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags: [oauth]
      summary: ปลายทางที่ provider ส่งผู้ใช้กลับมา
      description: |
        ลบ cookie handshake ทิ้งทุกครั้ง แล้ว **302 ไป `FRONTEND_OAUTH_CALLBACK_URL` เสมอ** (ยกเว้น provider ปิดอยู่ → 404 JSON)
        - สำเร็จ → `?code=<exchange code>` (ใช้ครั้งเดียว อายุ 2 นาที) นำไปแลกที่ `POST /api/v1/auth/oauth/exchange`
        - ล้มเหลว → `?error=<ข้อความไทย>` เช่น ผู้ใช้กดยกเลิก, state ไม่ตรง/ไม่มี cookie, ไม่มี code,
          provider ไม่ส่งอีเมล, อีเมลยังไม่ยืนยัน, แลก token ไม่สำเร็จ, บัญชีถูกระงับ

        การจับคู่บัญชี: identity เดิม (`auth.oauth_login`) → อีเมลตรงกับบัญชีที่ยังไม่ถูกลบ ผูกเพิ่มทุก role (`auth.oauth_link`)
        → สร้าง member ใหม่ที่ยังไม่มีรหัสผ่านและ `phone=""` (`auth.oauth_register`)
      operationId: oauthCallback
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderPath'
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: provider ส่งมาเมื่อผู้ใช้กดยกเลิก
          schema:
            type: string
      responses:
        '302':
          description: กลับไปหน้า frontend พร้อม `code` หรือ `error`
          headers:
            Location:
              schema:
                type: string
                format: uri
              example: http://localhost:3000/auth/callback?code=Zx8k...
        '404':
          description: provider ไม่รู้จักหรือปิดอยู่
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/oauth/exchange:
    post:
      tags: [oauth]
      summary: แลก exchange code เป็น token คู่
      operationId: exchangeOAuthCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
      responses:
        '200':
          description: ได้ token คู่
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: code ว่าง / ไม่มีจริง / หมดอายุ / ใช้ไปแล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthorized
                  message: ลิงก์เข้าสู่ระบบหมดอายุแล้ว กรุณาลองใหม่อีกครั้ง
        '403':
          $ref: '#/components/responses/AccountDisabled'

  # ================================================================== guest

  /api/v1/branches:
    get:
      tags: [guest]
      summary: สาขาที่เปิดใช้งาน พร้อมรูป สิ่งอำนวยความสะดวก และสถานที่ใกล้เคียง
      description: เฉพาะ `is_active=true` เรียงตาม `created_at` (AC-27)
      operationId: listBranches
      security: []
      responses:
        '200':
          description: รายการสาขา
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchListResponse'

  /api/v1/branches/{branchID}:
    get:
      tags: [guest]
      summary: รายละเอียดสาขา (รับทั้ง id และ slug)
      description: >
        ค่าที่ไม่ใช่ id ถูกตีความเป็น slug · ไม่เจอ หรือสาขาปิดใช้งาน → 404 ทั้งทาง id และ slug (AC-27)
      operationId: getBranch
      security: []
      parameters:
        - $ref: '#/components/parameters/BranchIDOrSlugPath'
      responses:
        '200':
          description: รายละเอียดสาขา
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/amenities:
    get:
      tags: [guest]
      summary: รายการสิ่งอำนวยความสะดวกกลางทั้งหมด
      description: เรียง `sort_order, name` · เพิ่ม/แก้ได้ทาง seed เท่านั้น
      operationId: listAmenities
      security: []
      responses:
        '200':
          description: รายการสิ่งอำนวยความสะดวก
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Amenity'

  /api/v1/room-types:
    get:
      tags: [guest]
      summary: ประเภทห้อง
      description: ไม่ส่ง `branch_id` = ทุกสาขาปนกัน · เรียง `sort_order, name`
      operationId: listRoomTypes
      security: []
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            pattern: "^brn-[0-9]+$"
      responses:
        '200':
          description: รายการประเภทห้อง
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomType'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/rooms/search:
    get:
      tags: [guest]
      summary: ค้นหาห้องที่จองได้
      description: |
        คืนเฉพาะห้องที่ `is_active`, `status=available` และสาขาเปิดใช้งาน · เรียง `branch_id, room_number` (AC-12)
        - ส่ง `check_in` และ `check_out` คู่กัน → ตัดห้องที่มีใบรายวันทับช่วง (ครึ่งเปิด: วันออกของใบเดิม = วันเข้าใหม่ ไม่ทับ)
          ส่งมาตัวเดียว → ไม่กรองใบรายวัน
        - ห้องที่มีใบรายเดือนถืออยู่ถูกตัดเมื่อ `move_in_date` ของใบนั้น ≤ `move_in_date` ที่ค้น (ไม่ส่ง = วันนี้ของ DB)
          — หลวมกว่าตอนจองจริง ห้องที่โผล่อาจจองแล้วได้ 409
        - `stay_type=daily` และ `check_out <= check_in` → 422 `fields.check_out`
        - แต่ละห้องมี `amenities` ของห้องนั้น แต่ไม่มี `images`
      operationId: searchRooms
      security: []
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            pattern: "^brn-[0-9]+$"
        - name: room_type_id
          in: query
          schema:
            type: string
            pattern: "^rmt-[0-9]+$"
        - $ref: '#/components/parameters/StayTypeQuery'
        - name: check_in
          in: query
          schema:
            type: string
            format: date
        - name: check_out
          in: query
          schema:
            type: string
            format: date
        - name: move_in_date
          in: query
          schema:
            type: string
            format: date
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: ผลค้นหาแบบแบ่งหน้า
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/rooms/{roomID}:
    get:
      tags: [guest]
      summary: รายละเอียดห้องพร้อมสิ่งอำนวยความสะดวกและแกลเลอรี
      description: >
        ห้องที่ถูกลบหรืออยู่ในสาขาที่ปิด → 404 · ห้องที่ `occupied`/`maintenance` ยังคืน 200 ตามปกติ (AC-27)
      operationId: getRoom
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomIDPath'
      responses:
        '200':
          description: รายละเอียดห้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ================================================================== me

  /api/v1/me:
    get:
      tags: [me]
      summary: ข้อมูลผู้ใช้ที่ล็อกอินอยู่
      operationId: getMe
      responses:
        '200':
          description: ข้อมูลผู้ใช้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [me]
      summary: แก้ไขโปรไฟล์ของตัวเอง
      description: >
        `first_name`, `last_name`, `phone` บังคับทุกครั้ง (บัญชีจาก OAuth ต้องกรอกเบอร์ก่อน)
        · ไม่ส่ง `avatar_url` = คงค่าเดิม (AC-29)
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
