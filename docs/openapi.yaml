  /api/v1/superadmin/staff/{userID}:
    put:
      tags: [superadmin]
      summary: แก้ไขบัญชีผู้ดูแล
      operationId: updateStaff
      parameters:
        - $ref: '#/components/parameters/UserIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: ระงับบัญชีตัวเองไม่ได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: bad_request
                  message: ระงับบัญชีตัวเองไม่ได้
        '404':
          description: ไม่พบ หรือเป้าหมายเป็นสมาชิกไม่ใช่ผู้ดูแล
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [superadmin]
      summary: ลบบัญชีผู้ดูแล (soft delete)
      operationId: deleteStaff
      parameters:
        - $ref: '#/components/parameters/UserIDPath'
      responses:
        '204':
          description: ลบสำเร็จ
        '400':
          description: ลบบัญชีตัวเองไม่ได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: bad_request
                  message: ลบบัญชีตัวเองไม่ได้
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BranchIDQuery:
      name: branch_id
      in: query
      required: false
      description: ผู้ดูแลระบุสาขาอื่นที่ไม่ใช่ของตัวเองไม่ได้ จะได้ 403
      schema:
        type: string
        format: uuid
    BranchIDPath:
      name: branchID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomIDPath:
      name: roomID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingIDPath:
      name: bookingID
      in: path
      required: true
      description: UUID ของการจอง ไม่ใช่ booking_code
      schema:
        type: string
        format: uuid
    UserIDPath:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: คำขอไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: bad_request
              message: คำขอไม่ถูกต้อง
    Unauthorized:
      description: ไม่ได้ล็อกอินหรือ token ใช้ไม่ได้
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: กรุณาเข้าสู่ระบบ
    ForbiddenCrossBranch:
      description: ไม่มีสิทธิ์เข้าถึงข้อมูลข้ามสาขา
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: เข้าถึงข้อมูลสาขาอื่นไม่ได้
    NotFound:
      description: ไม่พบข้อมูล
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: ไม่พบข้อมูลที่ระบุ
    InvalidState:
      description: สถานะปัจจุบันทำรายการนี้ไม่ได้
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_state
              message: สถานะปัจจุบันทำรายการนี้ไม่ได้
    ValidationFailed:
      description: ข้อมูลไม่ผ่านการตรวจสอบ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_failed
              message: ข้อมูลไม่ถูกต้อง
              fields:
                email: อีเมลนี้ถูกใช้งานแล้ว

  schemas:

    ErrorCode:
      type: string
      enum:
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - bad_request
        - validation_failed
        - method_not_allowed
        - internal_error
        - invalid_credentials
        - account_disabled
        - room_unavailable
        - invalid_state

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: ข้อความภาษาไทยสำหรับผู้ใช้
            fields:
              type: object
              nullable: true
              description: มีเฉพาะตอน code = validation_failed
              additionalProperties:
                type: string

    StayType:
      type: string
      enum: [daily, monthly]

    BookingStatus:
      type: string
      enum: [pending_payment, awaiting_review, approved, cancelled]

    RoomStatus:
      type: string
      enum: [available, occupied, maintenance]

    UserRole:
      type: string
      enum: [member, admin, super_admin]

    ActorRole:
      type: string
      enum: [member, admin, super_admin, system]

    PaymentStatus:
      type: string
      enum: [pending, approved, rejected]

    ActivityAction:
      type: string
      enum:
        - user.register
        - profile.update
        - password.change
        - booking.create
        - payment.submit
        - booking.cancel_by_member
        - booking.cancel_by_admin
        - booking.approve
        - booking.reject
        - booking.appointment_set
        - room.create
        - room.update
        - room.status_change
        - room.delete
        - branch.update
        - branch.amenities_update
        - branch.nearby_update
        - branch.image_add
        - branch.image_delete
        - staff.create
        - staff.update
        - staff.delete
        - booking.auto_expire

    PageMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer

    User:
      type: object
      required: [id, email, first_name, last_name, phone, role, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: มีค่าเฉพาะ role = admin
        avatar_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    AuthResult:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, phone]
      additionalProperties: false
      description: ส่งฟิลด์ role แถมมาจะได้ 422
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^[0-9]{9,10}$'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^[0-9]{9,10}$'
        avatar_url:
          type: string
          format: uri
          nullable: true

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 72
        confirm_password:
          type: string

    Amenity:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
          nullable: true

    RoomType:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        capacity:
          type: integer
          nullable: true

    BranchImage:
      type: object
      required: [id, image_url, sort_order]
      properties:
        id:
          type: string
          format: uuid
        image_url:
          type: string
          format: uri
        caption:
          type: string
          nullable: true
        sort_order:
          type: integer

    NearbyPlaceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        category:
          type: string
          nullable: true
        distance_km:
          type: number
          nullable: true

    NearbyPlace:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
        - $ref: '#/components/schemas/NearbyPlaceInput'

    Branch:
      type: object
      required: [id, name, address, contract_fee, is_active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        phones:
          type: array
          items:
            type: string
        contract_fee:
          type: number
          description: ค่าทำสัญญาที่เก็บตอนจองรายเดือน
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    BranchSummary:
      type: object
      required: [branch_id, name]
      properties:
        branch_id:
          type: string
          format: uuid
        name:
          type: string
        total_rooms:
          type: integer
        available_rooms:
          type: integer
        occupied_rooms:
          type: integer
        pending_bookings:
          type: integer

    BranchDetail:
      allOf:
        - $ref: '#/components/schemas/Branch'
        - type: object
          required: [images, amenities, nearby]
          properties:
            images:
              type: array
              items:
                $ref: '#/components/schemas/BranchImage'
            amenities:
              type: array
              items:
                $ref: '#/components/schemas/Amenity'
            nearby:
              type: array
              items:
                $ref: '#/components/schemas/NearbyPlace'

    UpdateBranchRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phones:
          type: array
          items:
            type: string
        contract_fee:
          type: number
          minimum: 0

    Room:
      type: object
      required: [id, branch_id, room_number, stay_type, price, status]
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        room_type_id:
          type: string
          format: uuid
          nullable: true
        room_number:
          type: string
        floor:
          type: integer
          nullable: true
        stay_type:
          $ref: '#/components/schemas/StayType'
        price:
          type: number
          description: ราคาต่อคืนเมื่อ stay_type = daily และราคาต่อเดือนเมื่อ monthly
        status:
          $ref: '#/components/schemas/RoomStatus'
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoomRequest:
      type: object
      required: [branch_id, room_number, stay_type, price]
      properties:
        branch_id:
          type: string
          format: uuid
        room_type_id:
          type: string
          format: uuid
          nullable: true
        room_number:
          type: string
          minLength: 1
        floor:
          type: integer
          nullable: true
        stay_type:
          $ref: '#/components/schemas/StayType'
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          nullable: true

    UpdateRoomRequest:
      type: object
      properties:
        room_type_id:
          type: string
          format: uuid
          nullable: true
        room_number:
          type: string
          minLength: 1
        floor:
          type: integer
          nullable: true
        stay_type:
          $ref: '#/components/schemas/StayType'
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          nullable: true

    CreateBookingRequest:
      type: object
      required: [room_id, stay_type, guest_first_name, guest_last_name, guest_phone]
      properties:
        room_id:
          type: string
          format: uuid
        stay_type:
          $ref: '#/components/schemas/StayType'
        guest_first_name:
          type: string
          minLength: 1
          maxLength: 100
        guest_last_name:
          type: string
          minLength: 1
          maxLength: 100
        guest_phone:
          type: string
          pattern: '^[0-9]{9,10}$'
        check_in_date:
          type: string
          format: date
          nullable: true
          description: บังคับเมื่อ stay_type = daily
        check_out_date:
          type: string
          format: date
          nullable: true
          description: บังคับเมื่อ stay_type = daily และต้องมากกว่า check_in_date
        move_in_date:
          type: string
          format: date
          nullable: true
          description: บังคับเมื่อ stay_type = monthly
        note:
          type: string
          nullable: true

    Booking:
      type: object
      required: [id, booking_code, room_id, branch_id, user_id, stay_type, status, total_amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        booking_code:
          type: string
          pattern: '^PT-[0-9]{6,}$'
          description: ใช้แสดงผลและค้นหาเท่านั้น ห้ามใช้อ้างอิงใน URL
        room_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        stay_type:
          $ref: '#/components/schemas/StayType'
        status:
          $ref: '#/components/schemas/BookingStatus'
        guest_first_name:
          type: string
        guest_last_name:
          type: string
        guest_phone:
          type: string
        check_in_date:
          type: string
          format: date
          nullable: true
        check_out_date:
          type: string
          format: date
          nullable: true
        move_in_date:
          type: string
          format: date
          nullable: true
        nights:
          type: integer
          nullable: true
          description: check_out_date - check_in_date เมื่อ stay_type = daily
        price_per_night:
          type: number
          nullable: true
          description: ราคาที่คัดลอกไว้ตอนจอง ไม่เปลี่ยนตามราคาห้องภายหลัง
        contract_fee:
          type: number
          nullable: true
          description: ค่าทำสัญญาที่คัดลอกไว้ตอนจอง
        total_amount:
          type: number
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: มีค่าเมื่อสถานะเป็น pending_payment
        appointment_at:
          type: string
          format: date-time
          nullable: true
        appointment_note:
          type: string
          nullable: true
        payments:
          type: array
          description: ประวัติการแจ้งชำระเงินทุกครั้ง เรียงจากเก่าไปใหม่
          items:
            $ref: '#/components/schemas/PaymentAttempt'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentAttempt:
      type: object
      required: [id, amount, transferred_at, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          description: ยอดที่ผู้ใช้แจ้ง อาจไม่ตรงกับ total_amount ให้ผู้ดูแลเป็นผู้ตัดสิน
        transferred_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reason:
          type: string
          nullable: true
          description: เหตุผลที่ปฏิเสธ มีค่าเมื่อ status = rejected
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      required: [id, message, is_read, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        message:
          type: string
        booking_code:
          type: string
          nullable: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    ActivityLog:
      type: object
      required: [id, actor_name, actor_role, action, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: เป็น null เมื่อผู้ทำเป็นระบบ (booking.auto_expire)
        actor_name:
          type: string
        actor_role:
          $ref: '#/components/schemas/ActorRole'
        branch_id:
          type: string
          format: uuid
          nullable: true
        action:
          $ref: '#/components/schemas/ActivityAction'
        entity_type:
          type: string
          nullable: true
        entity_id:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateStaffRequest:
      type: object
      required: [email, password, first_name, last_name, phone, branch_id]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^[0-9]{9,10}$'
        branch_id:
          type: string
          format: uuid

    UpdateStaffRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^[0-9]{9,10}$'
        branch_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        password:
          type: string
          minLength: 8
          maxLength: 72
