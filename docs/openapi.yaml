openapi: 3.0.3

info:
  title: Wisetsuk Nakorn Condo Booking API
  version: 1.0.0
  description: |
    REST API ระบบจองห้องพักวิเศษสุขนครคอนโด
    แหล่งความจริงเดียวของ contract — ทุก endpoint ตรงกับหัวข้อ API Contract ใน docs/SPEC.md

servers:
  - url: http://localhost:8080
    description: development

tags:
  - name: system
    description: ตรวจสอบสถานะระบบ
  - name: auth
    description: สมัครสมาชิก เข้าสู่ระบบ และจัดการ token
  - name: guest
    description: ข้อมูลสาธารณะที่ดูได้โดยไม่ต้องล็อกอิน
  - name: me
    description: โปรไฟล์ รหัสผ่าน และแจ้งเตือนของผู้ใช้ที่ล็อกอินอยู่
  - name: bookings
    description: สร้างและจัดการการจองของสมาชิก
  - name: admin
    description: งานของผู้ดูแล จำกัดอยู่ที่สาขาของตัวเองเท่านั้น
  - name: superadmin
    description: งานที่ทำได้เฉพาะผู้ดูแลสูงสุด

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: ตรวจสอบสถานะระบบ
      operationId: getHealth
      security: []
      responses:
        '200':
          description: ระบบทำงานปกติ
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status:
                    type: string
                    example: healthy
                  time:
                    type: string
                    format: date-time

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: สมัครสมาชิก
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: สมัครสำเร็จ ได้สิทธิ์ member เสมอ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: เข้าสู่ระบบ (ใช้ endpoint เดียวทุกบทบาท)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: อีเมลไม่มีในระบบหรือรหัสผ่านผิด (ข้อความเหมือนกันทั้งสองกรณี)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_credentials
                  message: อีเมลหรือรหัสผ่านไม่ถูกต้อง
        '403':
          description: บัญชีถูกปิดใช้งาน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: account_disabled
                  message: บัญชีนี้ถูกปิดใช้งาน

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: หมุน refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: ได้ token คู่ใหม่
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: ออกจากระบบ
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: ตอบ 204 เสมอ ไม่ว่า token จะใช้ได้หรือไม่

  /api/v1/branches:
    get:
      tags: [guest]
      summary: รายการสาขา
      operationId: listBranches
      security: []
      responses:
        '200':
          description: รายการสาขาที่เปิดใช้งาน
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'

  /api/v1/branches/{branchID}:
    get:
      tags: [guest]
      summary: รายละเอียดสาขาพร้อมรูป สิ่งอำนวยความสะดวก และสถานที่ใกล้เคียง
      operationId: getBranch
      security: []
      parameters:
        - $ref: '#/components/parameters/BranchIDPath'
      responses:
        '200':
          description: รายละเอียดสาขา
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/amenities:
    get:
      tags: [guest]
      summary: รายการสิ่งอำนวยความสะดวกทั้งหมด
      operationId: listAmenities
      security: []
      responses:
        '200':
          description: รายการสิ่งอำนวยความสะดวก
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Amenity'

  /api/v1/room-types:
    get:
      tags: [guest]
      summary: รายการประเภทห้อง
      operationId: listRoomTypes
      security: []
      parameters:
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: รายการประเภทห้อง
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomType'

  /api/v1/rooms/search:
    get:
      tags: [guest]
      summary: ค้นหาห้องว่าง
      operationId: searchRooms
      security: []
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: room_type_id
          in: query
          schema:
            type: string
            format: uuid
        - name: stay_type
          in: query
          schema:
            $ref: '#/components/schemas/StayType'
        - name: check_in
          in: query
          schema:
            type: string
            format: date
        - name: check_out
          in: query
          schema:
            type: string
            format: date
        - name: move_in_date
          in: query
          schema:
            type: string
            format: date
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: ผลการค้นหาแบบแบ่งหน้า
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/rooms/{roomID}:
    get:
      tags: [guest]
      summary: รายละเอียดห้อง
      operationId: getRoom
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomIDPath'
      responses:
        '200':
          description: รายละเอียดห้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/me:
    get:
      tags: [me]
      summary: ข้อมูลผู้ใช้ที่ล็อกอินอยู่
      operationId: getMe
      responses:
        '200':
          description: ข้อมูลผู้ใช้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [me]
      summary: แก้ไขโปรไฟล์
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/me/password:
    post:
      tags: [me]
      summary: เปลี่ยนรหัสผ่าน (เพิกถอน refresh token ทุกใบ)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: เปลี่ยนรหัสผ่านสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/me/notifications:
    get:
      tags: [me]
      summary: รายการแจ้งเตือนของตัวเอง
      operationId: listNotifications
      responses:
        '200':
          description: รายการแจ้งเตือนพร้อมจำนวนที่ยังไม่อ่าน
          content:
            application/json:
              schema:
                type: object
                required: [items, unread_count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unread_count:
                    type: integer

  /api/v1/me/notifications/read:
    post:
      tags: [me]
      summary: ทำเครื่องหมายว่าอ่านแล้ว (ไม่ระบุ id = อ่านทั้งหมด)
      operationId: markNotificationsRead
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
      responses:
        '204':
          description: สำเร็จ ตอบ 204 แม้ id ไม่ใช่ของตัวเองหรือไม่มีจริง

  /api/v1/bookings:
    get:
      tags: [bookings]
      summary: รายการการจองของตัวเอง
      operationId: listMyBookings
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: stay_type
          in: query
          schema:
            $ref: '#/components/schemas/StayType'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: รายการการจองแบบแบ่งหน้า
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      tags: [bookings]
      summary: สร้างการจอง
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: จองสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: ไม่พบห้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: ไม่พบห้องพักที่ระบุ
        '409':
          description: ห้องไม่ว่าง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: room_unavailable
                  message: ห้องนี้ถูกจองแล้ว
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bookings/{bookingID}:
    get:
      tags: [bookings]
      summary: รายละเอียดการจอง
      operationId: getBooking
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      responses:
        '200':
          description: รายละเอียดการจอง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: ไม่พบ ไม่ใช่เจ้าของ หรือคนละสาขา
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: ไม่พบการจองที่ระบุ

  /api/v1/bookings/{bookingID}/slip:
    get:
      tags: [bookings]
      summary: ดาวน์โหลดสลิปโอนเงิน (ตรวจสิทธิ์ก่อนเสิร์ฟ)
      operationId: getBookingSlip
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      responses:
        '200':
          description: ไฟล์สลิป
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: ไม่พบ ไม่มีสิทธิ์ หรือยังไม่เคยแนบสลิป (ตอบเหมือนกันหมด)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings/{bookingID}/cancel:
    post:
      tags: [bookings]
      summary: ยกเลิกการจอง
      operationId: cancelBooking
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      responses:
        '200':
          description: ยกเลิกสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/v1/bookings/{bookingID}/payment:
    post:
      tags: [bookings]
      summary: แจ้งชำระเงินพร้อมแนบสลิป
      operationId: submitPayment
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [slip, amount, transferred_at]
              properties:
                slip:
                  type: string
                  format: binary
                amount:
                  type: number
                transferred_at:
                  type: string
                  format: date-time
                note:
                  type: string
      responses:
        '200':
          description: แจ้งชำระเงินสำเร็จ สถานะเป็น awaiting_review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: ไฟล์ไม่ถูกต้องหรือใหญ่เกินกำหนด
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: bad_request
                  message: ไฟล์สลิปไม่ถูกต้อง
        '409':
          $ref: '#/components/responses/InvalidState'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/admin/dashboard:
    get:
      tags: [admin]
      summary: แดชบอร์ดผู้ดูแล
      operationId: getAdminDashboard
      responses:
        '200':
          description: สรุปข้อมูลรายสาขาและรายการล่าสุด
          content:
            application/json:
              schema:
                type: object
                required: [branches, recent]
                properties:
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/BranchSummary'
                  recent:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'

  /api/v1/admin/activity-logs:
    get:
      tags: [admin]
      summary: บันทึกการกระทำ
      operationId: listActivityLogs
      parameters:
        - name: actor_role
          in: query
          schema:
            $ref: '#/components/schemas/ActorRole'
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/ActivityAction'
        - $ref: '#/components/parameters/BranchIDQuery'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: รายการบันทึกแบบแบ่งหน้า
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityLog'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ForbiddenCrossBranch'

  /api/v1/admin/bookings:
    get:
      tags: [admin]
      summary: รายการการจองในสาขาที่ดูแล
      operationId: listAdminBookings
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: stay_type
          in: query
          schema:
            $ref: '#/components/schemas/StayType'
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/BranchIDQuery'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: รายการการจองแบบแบ่งหน้า
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '403':
          $ref: '#/components/responses/ForbiddenCrossBranch'

  /api/v1/admin/bookings/{bookingID}/approve:
    post:
      tags: [admin]
      summary: อนุมัติการจอง
      operationId: approveBooking
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      responses:
        '200':
          description: อนุมัติสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: ไม่พบ หรือเป็นใบของสาขาอื่น
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/v1/admin/bookings/{bookingID}/reject:
    post:
      tags: [admin]
      summary: ปฏิเสธการจอง (ใบกลับไปสถานะ pending_payment)
      operationId: rejectBooking
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: ปฏิเสธสำเร็จ ใบกลับไป pending_payment และตั้ง expires_at ใหม่
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: ไม่พบ หรือเป็นใบของสาขาอื่น
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/InvalidState'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/admin/bookings/{bookingID}/appointment:
    put:
      tags: [admin]
      summary: นัดหมายทำสัญญา (เฉพาะใบรายเดือน)
      operationId: setBookingAppointment
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_at]
              properties:
                appointment_at:
                  type: string
                  format: date-time
                note:
                  type: string
      responses:
        '200':
          description: นัดหมายสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: ไม่ใช่การจองรายเดือน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: bad_request
                  message: นัดหมายทำสัญญาใช้ได้เฉพาะการจองรายเดือน
        '409':
          $ref: '#/components/responses/InvalidState'
        '422':
