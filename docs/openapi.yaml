          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/me/password:
    post:
      tags: [me]
      summary: เปลี่ยนรหัสผ่าน หรือตั้งรหัสครั้งแรกสำหรับบัญชีจาก OAuth
      description: >
        บัญชีที่ยังไม่มีรหัสผ่านไม่ต้องส่ง `current_password` · สำเร็จแล้วปลด `must_change_password`
        และเพิกถอน refresh token ทุกใบของบัญชี (access token ใบเดิมยังใช้ได้จนหมดอายุ) (AC-29, AC-3)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: เปลี่ยนรหัสผ่านสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
              example:
                data:
                  message: เปลี่ยนรหัสผ่านเรียบร้อยแล้ว กรุณาเข้าสู่ระบบใหม่
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: >
            ไม่ส่ง/ส่งรหัสเดิมผิด (`fields.current_password`), รหัสใหม่ซ้ำรหัสเดิมหรือผิดกติกา (`fields.new_password`),
            ยืนยันไม่ตรง (`fields.confirm_password`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: validation_failed
                  message: ข้อมูลที่กรอกไม่ถูกต้อง
                  fields:
                    current_password: รหัสผ่านเดิมไม่ถูกต้อง

  /api/v1/me/notifications:
    get:
      tags: [me]
      summary: แจ้งเตือนล่าสุดของตัวเอง
      description: >
        `items` เรียงใหม่สุดก่อน ไม่เกิน 30 รายการ · `unread_count` นับที่ยังไม่อ่านทั้งหมด (ไม่จำกัดที่ 30)
      operationId: listNotifications
      responses:
        '200':
          description: รายการแจ้งเตือน
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, unread_count]
                    properties:
                      items:
                        type: array
                        maxItems: 30
                        items:
                          $ref: '#/components/schemas/Notification'
                      unread_count:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/notifications/read:
    post:
      tags: [me]
      summary: ทำเครื่องหมายว่าอ่านแล้ว
      description: >
        `{}` = อ่านทุกรายการ · `{"id":"ntf-001"}` = อ่านรายการเดียว (เป็นของคนอื่นหรือไม่มีจริง → 204 โดยไม่เปลี่ยนอะไร)
        · ต้องส่ง JSON body เสมอ ไม่มี body → 400
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  pattern: "^ntf-[0-9]+$"
      responses:
        '204':
          description: สำเร็จ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ================================================================== bookings

  /api/v1/bookings:
    get:
      tags: [bookings]
      summary: ประวัติการจองของตัวเอง (Member เท่านั้น)
      description: เรียงใหม่สุดก่อน · มี `latest_payment` เฉพาะใบที่ไม่ใช่ `pending_payment`
      operationId: listMyBookings
      parameters:
        - $ref: '#/components/parameters/BookingStatusQuery'
        - $ref: '#/components/parameters/StayTypeQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: รายการการจองแบบแบ่งหน้า
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [bookings]
      summary: สร้างการจอง (Member เท่านั้น)
      description: |
        ทั้งหมดอยู่ใน transaction เดียวที่ล็อกแถวห้อง (`SELECT ... FOR UPDATE`) (AC-6, AC-7, AC-8)
        - รายวัน: `total_amount = price × nights` · `nights = check_out_date - check_in_date`
        - รายเดือน: `total_amount = contract_fee` ของสาขา ณ ตอนจอง (ค่าเช่าเก็บวันทำสัญญา)
        - ใบที่ถือห้อง = `pending_payment`, `awaiting_review`, `approved`
          · มีใบรายเดือนถืออยู่ → จองอะไรก็ไม่ได้ · ใบรายวันทับช่วง → 409 · ห้อง `occupied`/`maintenance` → 409
        - ผลลัพธ์ `status = pending_payment` · member ได้แจ้งเตือน
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: จองสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: ไม่พบห้อง หรือห้องถูกลบ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/RoomUnavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bookings/{bookingID}:
    get:
      tags: [bookings]
      summary: รายละเอียดใบจองพร้อมการแจ้งชำระล่าสุด
      description: >
        เจ้าของใบ, admin สาขาเดียวกัน หรือ super admin · member คนอื่น → 404 · admin คนละสาขา → 403 (AC-4, AC-5)
      operationId: getBooking
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      responses:
        '200':
          description: รายละเอียดใบจอง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/bookings/{bookingID}/cancel:
    post:
      tags: [bookings]
      summary: ยกเลิกการจอง
      description: |
        ไม่มี body (AC-11)
        - member: ยกเลิกได้เฉพาะใบ `pending_payment` ของตัวเอง ใบสถานะอื่น → 409 · ใบของคนอื่น → 404
        - admin (สาขาตัวเอง) / super admin: ยกเลิกได้ทุกสถานะ รวมใบที่ยกเลิกไปแล้ว · admin คนละสาขา → 403
        - ใบรายเดือน → ห้องที่ `occupied` กลับเป็น `available` ถ้าไม่มีใบรายเดือนอื่นถืออยู่ (ห้อง `maintenance` ไม่ถูกแตะ)
      operationId: cancelBooking
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      responses:
        '200':
          description: ยกเลิกสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: member ยกเลิกใบที่ไม่ใช่ `pending_payment`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_state
                  message: รายการจองนี้ไม่สามารถยกเลิกเองได้ กรุณาติดต่อผู้ดูแลระบบของสาขา

  /api/v1/bookings/{bookingID}/payment:
    post:
      tags: [bookings]
      summary: แจ้งชำระเงินพร้อมแนบสลิป (Member เท่านั้น)
      description: |
        ลำดับการตรวจ (ผิดข้อแรกตอบทันที) (AC-9):
        1. id ผิดรูปแบบ → 400
        2. body ใหญ่เกิน `MAX_UPLOAD_MB`+1MB หรือพาร์ส multipart ไม่ได้ → 400
        3. `amount` ไม่ใช่ตัวเลข → 422 · 4. `transferred_at` พาร์สไม่ได้ → 422
        5. `note` ไม่ใช่ UTF-8 → 400 · 6. ไม่แนบ/ชนิดผิด/ใหญ่เกิน `slip` → 400 (ไฟล์ถูกเขียนลงดิสก์ตรงนี้)
        7. ใบไม่มีหรือเป็นของคนอื่น → 404 · 8. ใบไม่ใช่ `pending_payment` → 409
        9. `amount <= 0` หรือ `transferred_at` อนาคตเกิน 5 นาที → 422

        สำเร็จ → ใบเป็น `awaiting_review` และได้ `latest_payment` แถวใหม่ (`status=submitted`)
        ไม่เทียบ `amount` กับ `total_amount` · สลิปเก็บที่ `UPLOAD_DIR/slips/YYYY/MM/<uuid>.<ext>`
      operationId: submitPayment
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitPaymentForm'
      responses:
        '200':
          description: แจ้งชำระสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: ใบไม่อยู่ในสถานะที่แจ้งชำระได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_state
                  message: รายการจองนี้ไม่อยู่ในสถานะที่แจ้งชำระเงินได้
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ================================================================== admin

  /api/v1/admin/dashboard:
    get:
      tags: [admin]
      summary: สถิติรายสาขา + กิจกรรมล่าสุด 10 รายการ
      description: >
        admin เห็นเฉพาะสาขาตัวเอง · super admin เห็นทุกสาขา (รวมที่ปิดใช้งาน) และ **ไม่รับ** `branch_id`
        · "ว่าง" = ห้อง `status=available` ที่ยัง `is_active` (AC-25)
      operationId: getDashboard
