          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [superadmin]
      summary: เพิ่มบัญชีผู้ดูแล
      operationId: createStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: เพิ่มสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: อีเมลซ้ำหรือไม่พบสาขา
          content:
