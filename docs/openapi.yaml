      summary: กำหนดวันนัดหมายทำสัญญา (ใบรายเดือนเท่านั้น)
      description: >
        เขียนทับนัดเดิมได้ทุกครั้ง · ไม่ตรวจสถานะใบจอง · `appointment_at` พาร์สไม่ได้ → 422 (ตรวจก่อนหาใบ)
        · ใบรายวัน → 400 · ไม่อยู่ในอนาคต → 422 · admin คนละสาขา → 403 · member ได้แจ้งเตือน (AC-20)
      operationId: setAppointment
      parameters:
        - $ref: '#/components/parameters/BookingIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
      responses:
        '200':
          description: ตั้งนัดสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/admin/members:
    get:
      tags: [admin]
      summary: รายชื่อสมาชิกทั้งระบบ
      description: >
        member ที่ยังไม่ถูกลบทั้งหมด ไม่กรองตามสาขา (member ไม่ผูกสาขา) · `search` = ILIKE ในชื่อ นามสกุล อีเมล เบอร์
        · เรียงคนที่สมัครล่าสุดก่อน (AC-28)
      operationId: listMembers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: รายการแบบแบ่งหน้า
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/members/{memberID}/bookings:
    get:
      tags: [admin]
      summary: ประวัติการจองของสมาชิกรายคน
      description: >
        admin เห็นเฉพาะใบในสาขาตัวเอง · super admin เห็นทุกสาขา (ไม่รับ `branch_id`)
        · ผู้ใช้ไม่มีจริงหรือไม่ใช่ member → 200 รายการว่าง (AC-28)
      operationId: listMemberBookings
      parameters:
        - name: memberID
          in: path
          required: true
          schema:
            type: string
            pattern: "^usr-[0-9]+$"
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: รายการแบบแบ่งหน้า
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/rooms:
    get:
      tags: [admin]
      summary: ห้องทุกสถานะในสาขาที่ดูแล
      description: >
        ห้องที่ `is_active` ทุกสถานะ รวมห้องในสาขาที่ปิดใช้งาน · ไม่มี `amenities` แนบมา
        · รับ `check_in`/`check_out`/`move_in_date` ได้ (ตรวจรูปแบบ) แต่ไม่มีผลกรอง (AC-19)
      operationId: listAdminRooms
      parameters:
        - $ref: '#/components/parameters/BranchIDQuery'
        - name: room_type_id
          in: query
          schema:
            type: string
            pattern: "^rmt-[0-9]+$"
        - $ref: '#/components/parameters/StayTypeQuery'
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: รายการแบบแบ่งหน้า
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: เพิ่มห้องพัก
      description: >
        admin ไม่ส่ง `branch_id` = สาขาตัวเอง · ส่งสาขาอื่น → 403 · super admin ต้องส่ง ไม่งั้น 400
        · ห้องกับ `amenity_ids` ลงใน transaction เดียวกัน (AC-19)
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRoomRequest'
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalErrorForeignKey'

  /api/v1/admin/rooms/{roomID}:
    put:
      tags: [admin]
      summary: แก้ไขห้องพัก (แทนที่ทั้งชุด)
      description: >
        สาขายึดตามห้องเดิม (`branch_id` ใน body ถูกเมิน) · ไม่ส่ง `image_url` = คงรูปเดิม · ไม่ส่ง `amenity_ids` = คงเดิม
        · ไม่ส่ง `room_type_id`/`size_sqm` = กลายเป็นว่าง · ไม่ตรวจใบจองที่ค้างอยู่ (AC-19)
      operationId: updateRoom
      parameters:
        - $ref: '#/components/parameters/RoomIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRoomRequest'
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalErrorForeignKey'
    delete:
      tags: [admin]
      summary: ลบห้อง (soft delete — is_active = false)
      description: ไม่ตรวจใบจองที่ค้าง · ลบห้องที่ลบแล้วซ้ำ → 204 อีกครั้ง
      operationId: deleteRoom
      parameters:
        - $ref: '#/components/parameters/RoomIDPath'
      responses:
        '204':
          description: ลบสำเร็จ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

